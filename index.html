<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Veredas Locação</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 35px 20px;
  border-bottom: 2px solid #D4A23A;
}

header h1 {
  margin: 0;
  color: #D4A23A;
  font-size: 30px;
  letter-spacing: 2px;
}

header p {
  color: #bbb;
  margin-top: 8px;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 30px 16px 60px;
}

#status {
  text-align: center;
  color: #bbb;
  padding: 50px 15px;
}

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
}

.card {
  background: #141414;
  border: 1px solid #2b2b2b;
  border-radius: 10px;
  overflow: hidden;
}

.photo {
  width: 100%;
  height: 240px;
  background: #050505;
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.body {
  padding: 20px;
}

.body h2 {
  margin: 0 0 12px;
  color: #D4A23A;
  font-size: 22px;
}

.info {
  color: #bbb;
  line-height: 1.8;
  font-size: 14px;
}

.price {
  color: #D4A23A;
  font-size: 20px;
  font-weight: bold;
  margin: 15px 0;
}

.description {
  color: #bbb;
  line-height: 1.5;
  font-size: 14px;
  margin-bottom: 18px;
}

.button {
  display: block;
  background: #D4A23A;
  color: #000;
  text-decoration: none;
  text-align: center;
  font-weight: bold;
  padding: 14px;
  border-radius: 6px;
}

.button:hover {
  opacity: 0.9;
}

footer {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 25px;
  border-top: 1px solid #222;
}

@media (max-width: 600px) {

  header h1 {
    font-size: 23px;
  }

  #grid {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header>

  <h1>VEREDAS LOCAÇÃO</h1>

  <p>Veículos disponíveis para locação</p>

</header>


<main>

  <div id="status">
    Carregando veículos...
  </div>

  <div id="grid"></div>

</main>


<footer>

  Veredas Locação — Estoque atualizado automaticamente.

</footer>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzt41SCnmxFvh-r3aaQ5P4WXmtnQRLFKW2JcYM4prZtx9lJ5mCJuUgXkXJhBqeekHeu/exec?api=1";


const WHATSAPP = "5512987087431";


function escapar(valor) {

  const div = document.createElement("div");

  div.textContent =
    valor == null ? "" : String(valor);

  return div.innerHTML;

}


async function carregarEstoque() {

  const status =
    document.getElementById("status");

  const grid =
    document.getElementById("grid");


  try {

    const resposta =
      await fetch(API, {
        method: "GET",
        cache: "no-store"
      });


    if (!resposta.ok) {

      throw new Error(
        "Erro HTTP " + resposta.status
      );

    }


    const veiculos =
      await resposta.json();


    console.log("Veículos recebidos:", veiculos);


    if (
      !Array.isArray(veiculos) ||
      veiculos.length === 0
    ) {

      status.textContent =
        "Nenhum veículo disponível no momento.";

      return;

    }


    status.style.display = "none";


    grid.innerHTML =
      veiculos.map(function(v) {


        const mensagem =
          "Olá! Tenho interesse no " +
          (v.marca || "") +
          " " +
          (v.modelo || "") +
          " " +
          (v.ano || "") +
          ".";


        const whatsapp =
          "https://wa.me/" +
          WHATSAPP +
          "?text=" +
          encodeURIComponent(mensagem);


        return `

          <div class="card">

            <div class="photo">

              ${
                v.foto

                ?

                `<img
                  src="${escapar(v.foto)}"
                  alt="${escapar(v.marca)} ${escapar(v.modelo)}"
                >`

                :

                `<span>Foto em breve</span>`
              }

            </div>


            <div class="body">

              <h2>
                ${escapar(v.marca)}
                ${escapar(v.modelo)}
              </h2>


              <div class="info">

                <strong>Ano:</strong>
                ${escapar(v.ano)}

                <br>

                <strong>Câmbio:</strong>
                ${escapar(v.cambio)}

                <br>

                <strong>Período mínimo:</strong>
                ${escapar(v.periodoMinimo)}

              </div>


              <div class="price">

                ${escapar(v.valor)}

              </div>


              ${
                v.descricao

                ?

                `<div class="description">
                  ${escapar(v.descricao)}
                </div>`

                :

                ""
              }


              <a
                class="button"
                href="${whatsapp}"
                target="_blank"
              >
                ALUGAR ESTE CARRO
              </a>

            </div>

          </div>

        `;

      }).join("");

  }

  catch (erro) {

    console.error(
      "Erro ao carregar estoque:",
      erro
    );


    status.innerHTML =
      "Não foi possível conectar ao estoque.<br><br>" +
      "<small>" +
      "Erro: " +
      escapar(erro.message) +
      "</small>";

  }

}


carregarEstoque();

</script>

</body>
</html>
