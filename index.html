<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Veredas Locação</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

header {
  background: #000;
  padding: 25px 20px;
  text-align: center;
  border-bottom: 1px solid #D4A23A;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #D4A23A;
  letter-spacing: 2px;
}

.subtitulo {
  margin-top: 8px;
  color: #fff;
  font-size: 14px;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 30px 20px;
}

.titulo {
  text-align: center;
  color: #D4A23A;
  font-size: 30px;
  margin-bottom: 10px;
}

.descricao-topo {
  text-align: center;
  color: #ccc;
  margin-bottom: 35px;
}

#status {
  text-align: center;
  color: #ccc;
  margin: 30px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}

.card {
  background: #111;
  border: 1px solid #333;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.2s;
}

.card:hover {
  border-color: #D4A23A;
  transform: translateY(-3px);
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
  background: #222;
}

.card-content {
  padding: 20px;
}

.card h2 {
  color: #D4A23A;
  margin: 0 0 10px;
  font-size: 22px;
}

.info {
  color: #ddd;
  font-size: 14px;
  line-height: 1.7;
}

.preco {
  color: #fff;
  font-size: 22px;
  font-weight: bold;
  margin: 15px 0;
}

.minimo {
  color: #D4A23A;
  font-size: 14px;
  margin-bottom: 15px;
}

.obs {
  color: #aaa;
  font-size: 13px;
  margin-bottom: 15px;
}

.botao {
  display: block;
  width: 100%;
  padding: 14px;
  text-align: center;
  background: #D4A23A;
  color: #000;
  text-decoration: none;
  font-weight: bold;
  border-radius: 6px;
}

.botao:hover {
  opacity: 0.9;
}

.erro {
  color: #ff7777;
  text-align: center;
  padding: 30px;
}

footer {
  margin-top: 50px;
  padding: 25px;
  text-align: center;
  border-top: 1px solid #333;
  color: #888;
  font-size: 13px;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    VEREDAS LOCAÇÃO
  </div>

  <div class="subtitulo">
    Seu carro para o dia a dia
  </div>

</header>


<div class="container">

  <h1 class="titulo">
    VEÍCULOS DISPONÍVEIS
  </h1>

  <p class="descricao-topo">
    Confira nossos veículos disponíveis para locação.
  </p>

  <div id="status">
    Carregando veículos...
  </div>

  <div id="veiculos" class="grid"></div>

</div>


<footer>
  © Veredas Locação
</footer>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const PLANILHA_ID =
"1SSSd2qihULpOX-DAwhpeNnLabhwJR16fmYm0081Yi0k";

const ABA =
"Página 1";


/* =====================================================
   CALLBACK GLOBAL
===================================================== */

window.veredasCallback = function(resposta) {

  try {

    console.log("Resposta recebida do Google:", resposta);


    if (!resposta) {
      throw new Error("Resposta vazia.");
    }


    if (resposta.status &&
        String(resposta.status).toLowerCase() !== "ok") {

      throw new Error(
        resposta.errors
          ? JSON.stringify(resposta.errors)
          : "Google não retornou status OK."
      );

    }


    if (!resposta.table ||
        !resposta.table.rows) {

      throw new Error(
        "A resposta não possui tabela."
      );

    }


    const linhas =
      resposta.table.rows;


    const veiculos = [];


    linhas.forEach(function(linha) {

      const celulas =
        linha.c || [];


      function valorColuna(numero) {

        const celula =
          celulas[numero];


        if (!celula) {
          return "";
        }


        /*
          O Google pode fornecer:
          v = valor
          f = valor formatado

          Preferimos o valor formatado
          quando existir.
        */

        if (
          celula.f !== undefined &&
          celula.f !== null
        ) {

          return String(celula.f);

        }


        if (
          celula.v !== undefined &&
          celula.v !== null
        ) {

          return String(celula.v);

        }


        return "";

      }


      /*
        COLUNAS DA PLANILHA

        A = ID
        B = MARCA
        C = MODELO
        D = ANO
        E = CÂMBIO
        F = KM
        G = VALOR
        H = STATUS
        I = FOTO
        J = DESCRIÇÃO
        K = FOTOS
        L = PERÍODO MÍNIMO
        M = OBSERVAÇÕES
      */


      const carro = {

        id:
          valorColuna(0),

        marca:
          valorColuna(1),

        modelo:
          valorColuna(2),

        ano:
          valorColuna(3),

        cambio:
          valorColuna(4),

        km:
          valorColuna(5),

        valor:
          valorColuna(6),

        status:
          valorColuna(7),

        foto:
          valorColuna(8),

        descricao:
          valorColuna(9),

        fotos:
          valorColuna(10),

        periodoMinimo:
          valorColuna(11),

        observacoes:
          valorColuna(12)

      };


      /*
        Só mostra veículos
        com status Disponível.
      */

      if (
        normalizar(carro.status)
        === "disponivel"
      ) {

        veiculos.push(carro);

      }

    });


    mostrarVeiculos(veiculos);

  }


  catch (erro) {

    console.error(
      "Erro ao processar estoque:",
      erro
    );


    document.getElementById(
      "status"
    ).innerHTML =

      '<div class="erro">' +

      'Erro ao ler o estoque.' +

      '<br><br>' +

      '<small>' +
      'Verifique o console do navegador.' +
      '</small>' +

      '</div>';

  }

};


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(texto) {

  return String(texto || "")

    .trim()

    .toLowerCase()

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    );

}


/* =====================================================
   ENDEREÇO DA PLANILHA
===================================================== */

const URL_PLANILHA =

  "https://docs.google.com/spreadsheets/d/" +

  PLANILHA_ID +

  "/gviz/tq?" +

  "sheet=" +
  encodeURIComponent(ABA) +

  "&headers=1" +

  "&tqx=" +
  encodeURIComponent(
    "out:json;responseHandler:veredasCallback"
  );


/* =====================================================
   CARREGAR PLANILHA
===================================================== */

const script =
  document.createElement("script");


script.src =
  URL_PLANILHA;


script.async = true;


script.onerror = function() {

  document.getElementById(
    "status"
  ).innerHTML =

    '<div class="erro">' +

    'Não foi possível conectar ao estoque.' +

    '</div>';

};


document.head.appendChild(script);


/* =====================================================
   MOSTRAR VEÍCULOS
===================================================== */

function mostrarVeiculos(veiculos) {

  const container =
    document.getElementById(
      "veiculos"
    );


  const status =
    document.getElementById(
      "status"
    );


  container.innerHTML = "";


  if (veiculos.length === 0) {

    status.innerHTML =
      "Nenhum veículo disponível no momento.";

    return;

  }


  status.innerHTML =

    veiculos.length +

    (
      veiculos.length === 1
        ? " veículo disponível"
        : " veículos disponíveis"
    );


  veiculos.forEach(function(carro) {


    const card =
      document.createElement("div");


    card.className =
      "card";


    let imagem =
      carro.foto;


    if (!imagem) {

      imagem =
        "https://via.placeholder.com/800x500/111111/D4A23A?text=Veredas+Locação";

    }


    /*
      WhatsApp
    */

    const mensagem =

      "Olá! Tenho interesse no " +

      carro.marca +
      " " +
      carro.modelo +
      " " +
      carro.ano +

      " para locação.";


    const whatsapp =

      "https://wa.me/5512987087431?text=" +

      encodeURIComponent(
        mensagem
      );


    card.innerHTML = `

      <img
        src="${imagem}"
        alt="${carro.marca} ${carro.modelo}"
        onerror="this.src='https://via.placeholder.com/800x500/111111/D4A23A?text=Veredas+Locação'"
      >

      <div class="card-content">

        <h2>
          ${carro.marca}
          ${carro.modelo}
        </h2>


        <div class="info">

          <strong>Ano:</strong>
          ${carro.ano || "-"}
          <br>

          <strong>Câmbio:</strong>
          ${carro.cambio || "-"}
          <br>

          ${
            carro.km
              ? `
                <strong>KM:</strong>
                ${carro.km}
                <br>
              `
              : ""
          }

        </div>


        <div class="preco">

          ${carro.valor || "-"}

        </div>


        ${
          carro.periodoMinimo
            ? `
              <div class="minimo">

                Período mínimo:
                ${carro.periodoMinimo}

              </div>
            `
            : ""
        }


        ${
          carro.descricao
            ? `
              <div class="obs">

                ${carro.descricao}

              </div>
            `
            : ""
        }


        ${
          carro.observacoes
            ? `
              <div class="obs">

                ${carro.observacoes}

              </div>
            `
            : ""
        }


        <a
          class="botao"
          href="${whatsapp}"
          target="_blank"
          rel="noopener noreferrer"
        >

          TENHO INTERESSE

        </a>

      </div>

    `;


    container.appendChild(card);

  });

}

</script>

</body>
</html>
