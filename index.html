<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veredas Locação</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f2f2f2;font-family:Arial,sans-serif}
header{text-align:center;padding:30px 15px;border-bottom:2px solid #D4A23A}
h1{margin:0;color:#D4A23A;font-size:30px;letter-spacing:2px}
header p{color:#b8b8b8;margin:8px 0 0}
main{max-width:1200px;margin:auto;padding:30px 16px 60px}
#status{text-align:center;color:#b8b8b8;padding:50px 15px;line-height:1.6}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden}
.photo{height:230px;background:#000;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain}
.body{padding:18px}
h2{color:#D4A23A;font-size:21px;margin:0 0 10px}
.status{display:inline-block;border:1px solid #D4A23A;color:#D4A23A;border-radius:20px;padding:4px 10px;font-size:12px;text-transform:uppercase;margin-bottom:10px}
.info{color:#b8b8b8;font-size:14px;line-height:1.8}
.price{color:#D4A23A;font-size:19px;font-weight:bold;margin:10px 0}
.description{color:#b8b8b8;font-size:13px;line-height:1.5;margin-bottom:15px}
.button{display:block;background:#D4A23A;color:#000;text-align:center;text-decoration:none;font-weight:bold;padding:13px;border-radius:6px}
footer{text-align:center;color:#888;font-size:12px;padding:25px;border-top:1px solid #222}
@media(max-width:600px){h1{font-size:23px}#grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>VEREDAS LOCAÇÃO</h1>
<p>Estoque de veículos disponíveis</p>
</header>
<main>
<div id="status">Carregando veículos...</div>
<div id="grid"></div>
</main>
<footer>Veredas Locação — Estoque atualizado automaticamente.</footer>
<script>
var API="https://script.google.com/macros/s/AKfycbzt41SCnmxFvh-r3aaQ5P4WXmtnQRLFKW2JcYM4prZtx9lJ5mCJuUgXkXJhBqeekHeu/exec?api=1";
var WHATSAPP="5512987087431";

function esc(v){
  var d=document.createElement("div");
  d.textContent=v==null?"":String(v);
  return d.innerHTML;
}

window.veredasCallback=function(data){
  console.log("Veredas Locação - resposta da API:",data);

  var grid=document.getElementById("grid");
  var status=document.getElementById("status");

  if(typeof data === "string"){
    try{data=JSON.parse(data)}catch(e){}
  }

  if(data && !Array.isArray(data)){
    if(Array.isArray(data.data)) data=data.data;
    else if(Array.isArray(data.vehicles)) data=data.vehicles;
    else if(Array.isArray(data.veiculos)) data=data.veiculos;
  }

  if(!Array.isArray(data)){
    status.innerHTML="Não foi possível interpretar os dados do estoque.<br><small>Abra o console do navegador (F12) para ver o retorno da API.</small>";
    return;
  }

  if(data.length===0){
    status.innerHTML="Nenhum veículo disponível no momento.<br><small>Verifique se o STATUS da planilha está como Disponível.</small>";
    return;
  }

  status.style.display="none";

  grid.innerHTML=data.map(function(v){
    var mensagem="Olá! Tenho interesse no "+(v.marca||"")+" "+(v.modelo||"")+" "+(v.ano||"")+".";
    var whatsapp="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(mensagem);

    return '<div class="card">'+
      '<div class="photo">'+
        (v.foto ? '<img src="'+esc(v.foto)+'" alt="'+esc(v.marca)+' '+esc(v.modelo)+'">' : '<span>Foto em breve</span>')+
      '</div>'+ 
      '<div class="body">'+
        '<h2>'+esc(v.marca)+' '+esc(v.modelo)+'</h2>'+
        (v.status ? '<span class="status">'+esc(v.status)+'</span>' : '')+
        '<div class="info">'+
          '<strong>Ano:</strong> '+esc(v.ano)+'<br>'+
          '<strong>Câmbio:</strong> '+esc(v.cambio)+'<br>'+
          '<strong>Período mínimo:</strong> '+esc(v.periodoMinimo)+
        '</div>'+ 
        '<div class="price">'+esc(v.valor)+'</div>'+ 
        (v.descricao ? '<div class="description">'+esc(v.descricao)+'</div>' : '')+
        '<a class="button" href="'+whatsapp+'" target="_blank" rel="noopener">ALUGAR ESTE CARRO</a>'+ 
      '</div>'+ 
    '</div>';
  }).join("");
};

var script=document.createElement("script");
script.src=API+"&callback=veredasCallback&_="+Date.now();
script.onerror=function(){
  document.getElementById("status").innerHTML="Não foi possível conectar ao estoque.<br><small>Confira a implantação do site e tente novamente.</small>";
};
document.body.appendChild(script);
</script>
</body>
</html>
