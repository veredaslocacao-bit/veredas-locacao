<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Veredas Locação</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000000;
      color: #ffffff;
      min-height: 100vh;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    header {
      background: #000000;
      border-bottom: 1px solid #D4A23A;
      padding: 28px 20px;
      text-align: center;
    }

    .logo {
      color: #D4A23A;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .sublogo {
      margin-top: 7px;
      color: #ffffff;
      font-size: 13px;
      letter-spacing: 2px;
    }


    /* =========================
       TOPO
    ========================= */

    .hero {
      text-align: center;
      padding: 45px 20px 30px;
    }

    .hero h1 {
      color: #D4A23A;
      font-size: 30px;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #cccccc;
      font-size: 16px;
    }


    /* =========================
       ESTOQUE
    ========================= */

    .estoque {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    #status {
      text-align: center;
      color: #cccccc;
      margin: 10px 0 30px;
      font-size: 15px;
    }


    /* =========================
       CARDS
    ========================= */

    .veiculos {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(280px, 1fr)
      );

      gap: 28px;
    }

    .card {
      background: #111111;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #D4A23A;
      box-shadow: 0 8px 25px rgba(212,162,58,0.15);
    }


    /* =========================
       FOTO
    ========================= */

    .foto-container {
      width: 100%;
      height: 230px;
      background: #222222;
      overflow: hidden;
    }

    .foto-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sem-foto {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777777;
      font-size: 14px;
    }


    /* =========================
       CONTEÚDO DO CARD
    ========================= */

    .conteudo {
      padding: 20px;
    }

    .marca {
      color: #D4A23A;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }

    .modelo {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 18px;
    }


    /* =========================
       INFORMAÇÕES
    ========================= */

    .informacoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 17px;
    }

    .info {
      background: #1b1b1b;
      border: 1px solid #292929;
      border-radius: 6px;
      padding: 10px;
    }

    .info span {
      display: block;
      color: #888888;
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .info strong {
      color: #ffffff;
      font-size: 14px;
    }


    /* =========================
       PREÇO
    ========================= */

    .preco {
      color: #D4A23A;
      font-size: 25px;
      font-weight: bold;
      margin: 15px 0 5px;
    }

    .periodo {
      color: #bbbbbb;
      font-size: 13px;
      margin-bottom: 16px;
    }


    /* =========================
       DESCRIÇÃO
    ========================= */

    .descricao {
      color: #cccccc;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .observacoes {
      background: #191919;
      border-left: 3px solid #D4A23A;
      padding: 10px;
      color: #cccccc;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 18px;
    }


    /* =========================
       BOTÃO WHATSAPP
    ========================= */

    .botao {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;

      background: #D4A23A;
      color: #000000;

      font-weight: bold;
      font-size: 14px;
      letter-spacing: 0.5px;

      padding: 14px;
      border-radius: 6px;

      transition: all 0.3s ease;
    }

    .botao:hover {
      background: #ffffff;
      color: #000000;
    }


    /* =========================
       SEM VEÍCULOS
    ========================= */

    .vazio {
      text-align: center;
      color: #999999;
      padding: 40px 20px;
      grid-column: 1 / -1;
    }


    /* =========================
       ERRO
    ========================= */

    .erro {
      max-width: 650px;
      margin: 30px auto;
      padding: 22px;

      background: #1b1111;
      border: 1px solid #7a3030;
      border-radius: 8px;

      text-align: center;
      color: #ffaaaa;
      line-height: 1.6;
    }


    /* =========================
       RODAPÉ
    ========================= */

    footer {
      border-top: 1px solid #222222;
      margin-top: 60px;
      padding: 30px 20px;

      text-align: center;
      color: #888888;
      font-size: 13px;
    }

    footer strong {
      color: #D4A23A;
      font-size: 15px;
      letter-spacing: 1px;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      .logo {
        font-size: 26px;
      }

      .hero {
        padding-top: 35px;
      }

      .hero h1 {
        font-size: 25px;
      }

      .foto-container {
        height: 210px;
      }

      .modelo {
        font-size: 22px;
      }

      .preco {
        font-size: 23px;
      }

    }

  </style>
</head>


<body>


  <!-- CABEÇALHO -->

  <header>

    <div class="logo">
      VEREDAS LOCAÇÃO
    </div>

    <div class="sublogo">
      LOCAÇÃO DE VEÍCULOS
    </div>

  </header>


  <!-- TOPO -->

  <section class="hero">

    <h1>
      NOSSOS VEÍCULOS
    </h1>

    <p>
      Confira os veículos disponíveis para locação.
    </p>

  </section>


  <!-- ESTOQUE -->

  <main class="estoque">

    <div id="status">
      Carregando veículos...
    </div>

    <div id="veiculos" class="veiculos"></div>

  </main>


  <!-- RODAPÉ -->

  <footer>

    <p>
      <strong>VEREDAS LOCAÇÃO</strong>
    </p>

    <p style="margin-top:8px;">
      Fale conosco pelo WhatsApp
    </p>

    <p style="margin-top:8px;">
      (12) 98708-7431
    </p>

  </footer>


  <script>


    /* =========================
       CONFIGURAÇÃO
    ========================= */

    const PLANILHA_ID =
      "1SSSd2qihULpOX-DAwhpeNnLabhwJR16fmYm0081Yi0k";

    const ABA =
      "Página 1";

    const WHATSAPP =
      "5512987087431";


    /* =========================
       NORMALIZAR TEXTO
    ========================= */

    function normalizarTexto(texto) {

      return String(texto || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

    }


    /* =========================
       CALLBACK GOOGLE SHEETS
    ========================= */

    window.veredasCallback = function(resposta) {

      try {

        if (!resposta || resposta.status !== "ok") {

          mostrarErro(
            "Não foi possível carregar o estoque da planilha."
          );

          return;

        }


        const tabela = resposta.table;


        if (!tabela || !tabela.rows) {

          mostrarErro(
            "A planilha não retornou veículos."
          );

          return;

        }


        const veiculos = [];


        tabela.rows.forEach(function(linha) {

          const c = linha.c || [];


          function valor(coluna) {

            if (!c[coluna]) {
              return "";
            }

            return c[coluna].f !== undefined
              ? c[coluna].f
              : (
                  c[coluna].v !== undefined
                    ? c[coluna].v
                    : ""
                );

          }


          const status = valor(7);


          if (
            normalizarTexto(status) !== "disponivel"
          ) {

            return;

          }


          veiculos.push({

            id: valor(0),

            marca: valor(1),

            modelo: valor(2),

            ano: valor(3),

            cambio: valor(4),

            km: valor(5),

            valor: valor(6),

            status: valor(7),

            foto: valor(8),

            descricao: valor(9),

            fotos: valor(10),

            periodoMinimo: valor(11),

            observacoes: valor(12)

          });

        });


        mostrarVeiculos(veiculos);

      }

      catch (erro) {

        console.error(erro);

        mostrarErro(
          "Ocorreu um erro ao carregar o estoque."
        );

      }

    };


    /* =========================
       MOSTRAR VEÍCULOS
    ========================= */

    function mostrarVeiculos(veiculos) {

      const container =
        document.getElementById("veiculos");

      const status =
        document.getElementById("status");


      container.innerHTML = "";


      if (!veiculos.length) {

        status.textContent =
          "Nenhum veículo disponível no momento.";

        container.innerHTML = `

          <div class="vazio">

            No momento não temos veículos
            disponíveis para locação.

          </div>

        `;

        return;

      }


      status.textContent =
        veiculos.length === 1
          ? "1 veículo disponível"
          : veiculos.length + " veículos disponíveis";


      veiculos.forEach(function(veiculo) {


        const card =
          document.createElement("div");

        card.className = "card";


        /* FOTO */

        let fotoHTML = `

          <div class="sem-foto">
            Foto não disponível
          </div>

        `;


        if (veiculo.foto) {

          fotoHTML = `

            <img
              src="${escaparHTML(veiculo.foto)}"
              alt="${escaparHTML(
                veiculo.marca +
                " " +
                veiculo.modelo
              )}"
              onerror="
                this.style.display='none';
                this.parentElement.innerHTML=
                '<div class=&quot;sem-foto&quot;>Foto não disponível</div>';
              "
            >

          `;

        }


        /* WHATSAPP */

        const mensagem =
          "Olá! Tenho interesse no " +
          veiculo.marca + " " +
          veiculo.modelo + " " +
          veiculo.ano +
          " para locação.";


        const linkWhatsApp =
          "https://wa.me/" +
          WHATSAPP +
          "?text=" +
          encodeURIComponent(mensagem);


        /* INFORMAÇÕES */

        let informacoes = "";


        if (veiculo.ano) {

          informacoes += `

            <div class="info">

              <span>Ano</span>

              <strong>
                ${escaparHTML(veiculo.ano)}
              </strong>

            </div>

          `;

        }


        if (veiculo.cambio) {

          informacoes += `

            <div class="info">

              <span>Câmbio</span>

              <strong>
                ${escaparHTML(veiculo.cambio)}
              </strong>

            </div>

          `;

        }


        if (veiculo.km) {

          informacoes += `

            <div class="info">

              <span>KM</span>

              <strong>
                ${escaparHTML(veiculo.km)}
              </strong>

            </div>

          `;

        }


        /* PERÍODO */

        let periodoHTML = "";


        if (veiculo.periodoMinimo) {

          periodoHTML = `

            <div class="periodo">

              Período mínimo:

              <strong>
                ${escaparHTML(
                  veiculo.periodoMinimo
                )}
              </strong>

            </div>

          `;

        }


        /* DESCRIÇÃO */

        let descricaoHTML = "";


        if (veiculo.descricao) {

          descricaoHTML = `

            <div class="descricao">

              ${escaparHTML(
                veiculo.descricao
              )}

            </div>

          `;

        }


        /* OBSERVAÇÕES */

        let observacoesHTML = "";


        if (veiculo.observacoes) {

          observacoesHTML = `

            <div class="observacoes">

              ${escaparHTML(
                veiculo.observacoes
              )}

            </div>

          `;

        }


        /* CARD */

        card.innerHTML = `

          <div class="foto-container">

            ${fotoHTML}

          </div>


          <div class="conteudo">


            <div class="marca">

              ${escaparHTML(
                veiculo.marca
              )}

            </div>


            <div class="modelo">

              ${escaparHTML(
                veiculo.modelo
              )}

            </div>


            <div class="informacoes">

              ${informacoes}

            </div>


            <div class="preco">

              ${escaparHTML(
                veiculo.valor
              )}

            </div>


            ${periodoHTML}


            ${descricaoHTML}


            ${observacoesHTML}


            <a
              class="botao"
              href="${linkWhatsApp}"
              target="_blank"
              rel="noopener noreferrer"
            >

              TENHO INTERESSE

            </a>


          </div>

        `;


        container.appendChild(card);

      });

    }


    /* =========================
       ERRO
    ========================= */

    function mostrarErro(mensagem) {

      document.getElementById(
        "status"
      ).textContent = "";


      document.getElementById(
        "veiculos"
      ).innerHTML = `

        <div class="erro">

          <strong>
            Não foi possível carregar o estoque.
          </strong>

          <br><br>

          ${escaparHTML(mensagem)}

          <br><br>

          Verifique se a planilha está compartilhada
          como <strong>"Qualquer pessoa com o link"</strong>.

        </div>

      `;

    }


    /* =========================
       SEGURANÇA
    ========================= */

    function escaparHTML(valor) {

      return String(valor || "")

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       CARREGAR PLANILHA
    ========================= */

    function carregarEstoque() {

      const script =
        document.createElement("script");


      const url =
        "https://docs.google.com/spreadsheets/d/" +
        PLANILHA_ID +
        "/gviz/tq" +
        "?sheet=" +
        encodeURIComponent(ABA) +
        "&headers=1" +
        "&tqx=out:json;responseHandler:veredasCallback" +
        "&_=" +
        Date.now();


      script.src = url;


      script.onerror = function() {

        mostrarErro(
          "Não foi possível acessar a planilha."
        );

      };


      document.body.appendChild(script);

    }


    /* =========================
       INICIAR
    ========================= */

    carregarEstoque();


  </script>

</body>
</html>
